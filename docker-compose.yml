name: neo

services:
  workers:
    container_name: workers_neo
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # host.docker.internal, not localhost — localhost inside the container
      # is the container itself, so the host's Ollama would be unreachable.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - WHATSAPP_SESSION_PATH=/data/whatsapp.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - SENTRY_DSN=${SENTRY_DSN_WORKERS:-}
      - PARSER_TIMEZONE=${PARSER_TIMEZONE:-}
      - PARSER_MAX_CONCURRENT=${PARSER_MAX_CONCURRENT:-8}
      - PARSER_RECOVERY_INTERVAL=${PARSER_RECOVERY_INTERVAL:-5m}
    volumes:
      - whatsapp-session:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - neo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/workers", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  graphql-api:
    container_name: graphql_api_neo
    build:
      context: .
      dockerfile: apps/graphql-api/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      - PORT=8082
      - ENV=${ENV:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-1048576}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-50}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-100}
      - AUTH_ALLOW_HS256=${AUTH_ALLOW_HS256:-false}
      # ${VAR-default} (no colon) on purpose: an explicitly-empty value in
      # .env must pass through to disable the audience check.
      - AUTH_EXPECTED_AUDIENCE=${AUTH_EXPECTED_AUDIENCE-authenticated}
      - AUTH_EXPECTED_ISSUER=${AUTH_EXPECTED_ISSUER:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - SENTRY_DSN=${SENTRY_DSN_GRAPHQL_API:-}
      - GRAPHQL_COMPLEXITY_LIMIT=${GRAPHQL_COMPLEXITY_LIMIT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - neo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/graphql-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  neo-network:
    driver: bridge

volumes:
  whatsapp-session:
